<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edexcel A-Level Maths — Topic Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #f7f9ff;
    --border: #dde5f7;
    --blue-primary: #2563eb;
    --blue-light: #eff6ff;
    --blue-mid: #bfdbfe;
    --blue-dark: #1e40af;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --green: #16a34a;
    --green-bg: #f0fdf4;
    --green-border: #bbf7d0;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --yellow: #d97706;
    --yellow-bg: #fffbeb;
    --yellow-border: #fde68a;
    --shadow: 0 1px 3px rgba(37,99,235,0.08), 0 4px 16px rgba(37,99,235,0.06);
    --shadow-lg: 0 8px 32px rgba(37,99,235,0.12);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(37,99,235,0.07);
  }
  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 0;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--blue-primary), var(--blue-dark));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 16px; font-weight: 700;
  }
  .logo-text { font-size: 17px; font-weight: 600; color: var(--blue-dark); }
  .logo-sub { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .header-stats {
    display: flex; gap: 12px; flex: 1; justify-content: center; flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    color: var(--text-muted); font-weight: 500;
  }
  .stat-pill span { font-weight: 700; color: var(--text); }
  .stat-pill.green span { color: var(--green); }
  .stat-pill.red span { color: var(--red); }
  .stat-pill.yellow span { color: var(--yellow); }
  .stat-pill.blue span { color: var(--blue-primary); }

  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    padding: 8px 16px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; cursor: pointer;
    border: none; transition: all 0.15s; font-family: inherit;
  }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-primary {
    background: var(--blue-primary); color: white;
  }
  .btn-primary:hover { background: var(--blue-dark); }

  /* ── Toolbar ── */
  .toolbar {
    max-width: 1100px;
    margin: 24px auto 16px;
    padding: 0 24px;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1; min-width: 200px; position: relative;
  }
  .search-icon {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-light); font-size: 15px;
  }
  .search-input {
    width: 100%; padding: 10px 12px 10px 36px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); font-family: inherit; font-size: 14px;
    color: var(--text); outline: none; transition: border 0.15s;
  }
  .search-input:focus { border-color: var(--blue-primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); transition: all 0.15s; font-family: inherit;
  }
  .filter-btn:hover { border-color: var(--blue-primary); color: var(--blue-primary); }
  .filter-btn.active { background: var(--blue-primary); border-color: var(--blue-primary); color: white; }
  .filter-btn.active-green { background: var(--green); border-color: var(--green); color: white; }
  .filter-btn.active-red { background: var(--red); border-color: var(--red); color: white; }
  .filter-btn.active-yellow { background: var(--yellow); border-color: var(--yellow); color: white; }

  /* ── Legend ── */
  .legend-bar {
    max-width: 1100px; margin: 0 auto 20px; padding: 0 24px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .legend-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-right: 4px; }
  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 500; padding: 4px 10px;
    border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-item.easy { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
  .legend-item.hard { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .legend-item.review { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
  .legend-item.none-item { background: var(--surface2); border-color: var(--border); color: var(--text-muted); }

  /* ── Main Layout ── */
  .main { max-width: 1100px; margin: 0 auto; padding: 0 24px 60px; }

  /* ── Section ── */
  .section { margin-bottom: 20px; }
  .section-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); transition: all 0.15s;
    user-select: none;
  }
  .section-header:hover { border-color: var(--blue-mid); box-shadow: var(--shadow); }
  .section-header.open { border-radius: var(--radius) var(--radius) 0 0; border-bottom-color: transparent; }

  .section-code {
    background: var(--blue-primary); color: white;
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    padding: 3px 9px; border-radius: 6px; flex-shrink: 0;
  }
  .section-title { font-size: 15px; font-weight: 600; flex: 1; }
  .section-meta { display: flex; gap: 8px; align-items: center; }
  .section-count {
    font-size: 12px; color: var(--text-muted);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 10px; font-weight: 500;
  }
  .section-progress {
    width: 80px; height: 5px; background: var(--border);
    border-radius: 3px; overflow: hidden; flex-shrink: 0;
  }
  .section-progress-bar { height: 100%; background: var(--blue-primary); border-radius: 3px; transition: width 0.3s; }
  .chevron {
    color: var(--text-muted); font-size: 12px; transition: transform 0.2s; flex-shrink: 0;
  }
  .chevron.open { transform: rotate(180deg); }

  .section-body {
    background: var(--surface); border: 1px solid var(--border);
    border-top: none; border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
  }

  /* Subsection */
  .subsection-header {
    padding: 8px 18px 4px;
    font-size: 11px; font-weight: 600; color: var(--blue-primary);
    text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--blue-light); border-bottom: 1px solid var(--blue-mid);
    display: flex; align-items: center; gap: 6px;
  }
  .subsection-badge {
    background: var(--blue-primary); color: white;
    font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600;
    text-transform: none; letter-spacing: 0;
  }
  .subsection-badge.as { background: #6366f1; }
  .subsection-badge.alevel { background: #0891b2; }

  /* Topic Row */
  .topic-row {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 18px; border-bottom: 1px solid var(--border);
    transition: background 0.12s; cursor: default;
  }
  .topic-row:last-child { border-bottom: none; }
  .topic-row:hover { background: var(--surface2); }

  /* Highlighted states */
  .topic-row.hl-easy { background: var(--green-bg) !important; }
  .topic-row.hl-easy:hover { background: #dcfce7 !important; }
  .topic-row.hl-hard { background: var(--red-bg) !important; }
  .topic-row.hl-hard:hover { background: #fee2e2 !important; }
  .topic-row.hl-review { background: var(--yellow-bg) !important; }
  .topic-row.hl-review:hover { background: #fef3c7 !important; }

  .topic-check {
    width: 18px; height: 18px; flex-shrink: 0;
    border: 2px solid var(--border); border-radius: 5px;
    cursor: pointer; appearance: none; -webkit-appearance: none;
    transition: all 0.15s; background: var(--surface); position: relative;
  }
  .topic-check:hover { border-color: var(--blue-primary); }
  .topic-check:checked {
    background: var(--blue-primary); border-color: var(--blue-primary);
  }
  .topic-check:checked::after {
    content: '✓'; position: absolute; top: -1px; left: 2px;
    color: white; font-size: 12px; font-weight: 700;
  }

  .topic-code {
    font-family: 'DM Mono', monospace; font-size: 11px;
    color: var(--text-muted); min-width: 60px; flex-shrink: 0;
  }
  .topic-name { font-size: 13px; flex: 1; line-height: 1.4; }
  .topic-name.checked { text-decoration: line-through; color: var(--text-light); }

  .topic-tag {
    font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 8px; flex-shrink: 0;
  }
  .topic-tag.as { background: #ede9fe; color: #6d28d9; }
  .topic-tag.alevel { background: #e0f2fe; color: #0369a1; }

  .hl-btn {
    width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--border);
    cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
    background: transparent; transition: all 0.15s; flex-shrink: 0; color: var(--text-light);
  }
  .hl-btn:hover { transform: scale(1.1); }
  .hl-btn.easy { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
  .hl-btn.hard { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }
  .hl-btn.review { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }

  /* No results */
  .no-results {
    text-align: center; padding: 60px 20px; color: var(--text-muted);
  }
  .no-results .icon { font-size: 40px; margin-bottom: 12px; }
  .no-results h3 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }

  /* Progress bar at bottom */
  .progress-footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 10px 32px; display: flex; align-items: center; gap: 16px;
    box-shadow: 0 -4px 16px rgba(37,99,235,0.06);
  }
  .pf-label { font-size: 13px; font-weight: 600; color: var(--text); min-width: 160px; }
  .pf-bar { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .pf-fill { height: 100%; background: linear-gradient(90deg, var(--blue-primary), #60a5fa); border-radius: 4px; transition: width 0.4s; }
  .pf-pct { font-size: 14px; font-weight: 700; color: var(--blue-primary); min-width: 40px; text-align: right; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">M</div>
      <div>
        <div class="logo-text">Edexcel A-Level Maths</div>
        <div class="logo-sub">9MA0 Topic Tracker</div>
      </div>
    </div>
    <div class="header-stats" id="headerStats"></div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="resetAll()">Reset All</button>
      <button class="btn btn-primary" onclick="expandAll()">Expand All</button>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" type="text" placeholder="Search topics…" id="searchInput" oninput="applyFilters()">
  </div>
  <div class="filter-group" id="filterGroup">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-filter="as" onclick="setFilter('as', this)">⭐ AS Only</button>
    <button class="filter-btn" data-filter="alevel" onclick="setFilter('alevel', this)">■ A-Level Only</button>
    <button class="filter-btn" data-filter="unchecked" onclick="setFilter('unchecked', this)">Unchecked</button>
    <button class="filter-btn" data-filter="checked" onclick="setFilter('checked', this)">✓ Done</button>
  </div>
  <div class="filter-group">
    <button class="filter-btn" data-filter="easy" onclick="setHighlightFilter('easy', this)">🟢 Easy</button>
    <button class="filter-btn" data-filter="hard" onclick="setHighlightFilter('hard', this)">🔴 Hard</button>
    <button class="filter-btn" data-filter="review" onclick="setHighlightFilter('review', this)">🟡 Review</button>
  </div>
</div>

<div class="legend-bar">
  <span class="legend-label">Highlight key:</span>
  <div class="legend-item easy" onclick="setHighlightFilter('easy')">
    <div class="legend-dot" style="background:var(--green)"></div> Easy / Got it
  </div>
  <div class="legend-item hard" onclick="setHighlightFilter('hard')">
    <div class="legend-dot" style="background:var(--red)"></div> Hard / Struggling
  </div>
  <div class="legend-item review" onclick="setHighlightFilter('review')">
    <div class="legend-dot" style="background:var(--yellow)"></div> Needs Review
  </div>
  <div class="legend-item none-item">Click 🟢🔴🟡 on any topic to highlight</div>
</div>

<div class="main" id="mainContent"></div>

<div class="progress-footer">
  <div class="pf-label">Overall Progress</div>
  <div class="pf-bar"><div class="pf-fill" id="pfFill" style="width:0%"></div></div>
  <div class="pf-pct" id="pfPct">0%</div>
</div>

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = {}; // { [topicId]: { checked: bool, highlight: 'none'|'easy'|'hard'|'review' } }
let activeFilter = 'all';
let activeHlFilter = null;
let openSections = new Set();

function loadState() {
  try {
    const saved = localStorage.getItem('edexcel_tracker_v2');
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  try { localStorage.setItem('edexcel_tracker_v2', JSON.stringify(state)); } catch(e) {}
}

function getTopicState(id) {
  if (!state[id]) state[id] = { checked: false, highlight: 'none' };
  return state[id];
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const container = document.getElementById('mainContent');
  container.innerHTML = '';
  const query = document.getElementById('searchInput').value.toLowerCase().trim();

  let totalTopics = 0, checkedTopics = 0, easyCount = 0, hardCount = 0, reviewCount = 0;

  SECTIONS.forEach(section => {
    // Count all topics
    section.groups.forEach(g => g.topics.forEach(t => {
      const ts = getTopicState(t.id);
      totalTopics++;
      if (ts.checked) checkedTopics++;
      if (ts.highlight === 'easy') easyCount++;
      if (ts.highlight === 'hard') hardCount++;
      if (ts.highlight === 'review') reviewCount++;
    }));

    // Filter logic
    const filteredGroups = section.groups.map(g => {
      const filteredTopics = g.topics.filter(t => {
        const ts = getTopicState(t.id);
        if (query && !t.name.toLowerCase().includes(query) && !t.id.toLowerCase().includes(query)) return false;
        if (activeFilter === 'as' && t.level !== 'as') return false;
        if (activeFilter === 'alevel' && t.level !== 'alevel') return false;
        if (activeFilter === 'checked' && !ts.checked) return false;
        if (activeFilter === 'unchecked' && ts.checked) return false;
        if (activeHlFilter && ts.highlight !== activeHlFilter) return false;
        return true;
      });
      return { ...g, topics: filteredTopics };
    }).filter(g => g.topics.length > 0);

    if (filteredGroups.length === 0) return;

    const sectionTopicCount = section.groups.reduce((a,g) => a + g.topics.length, 0);
    const sectionChecked = section.groups.reduce((a,g) => a + g.topics.filter(t => getTopicState(t.id).checked).length, 0);
    const pct = sectionTopicCount ? Math.round(sectionChecked / sectionTopicCount * 100) : 0;
    const isOpen = openSections.has(section.code) || query.length > 0 || activeHlFilter;

    const sectionEl = document.createElement('div');
    sectionEl.className = 'section';
    sectionEl.innerHTML = `
      <div class="section-header ${isOpen ? 'open' : ''}" onclick="toggleSection('${section.code}', this)">
        <div class="section-code">${section.code}</div>
        <div class="section-title">${section.title}</div>
        <div class="section-meta">
          <div class="section-count">${sectionChecked}/${sectionTopicCount}</div>
          <div class="section-progress"><div class="section-progress-bar" style="width:${pct}%"></div></div>
        </div>
        <div class="chevron ${isOpen ? 'open' : ''}">▼</div>
      </div>
      ${isOpen ? `<div class="section-body" id="body-${section.code}">${renderGroups(filteredGroups)}</div>` : ''}
    `;
    container.appendChild(sectionEl);
  });

  if (container.innerHTML === '') {
    container.innerHTML = `<div class="no-results"><div class="icon">🔍</div><h3>No topics found</h3><p>Try a different search or filter.</p></div>`;
  }

  // Update header stats
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-pill blue"><span>${checkedTopics}</span>/${totalTopics} Done</div>
    <div class="stat-pill green"><span>${easyCount}</span> Easy</div>
    <div class="stat-pill red"><span>${hardCount}</span> Hard</div>
    <div class="stat-pill yellow"><span>${reviewCount}</span> Review</div>
  `;

  // Footer progress
  const pctTotal = totalTopics ? Math.round(checkedTopics / totalTopics * 100) : 0;
  document.getElementById('pfFill').style.width = pctTotal + '%';
  document.getElementById('pfPct').textContent = pctTotal + '%';
}

function renderGroups(groups) {
  return groups.map(g => `
    <div class="subsection-header">
      <span class="subsection-badge ${g.badge === 'as' ? 'as' : g.badge === 'alevel' ? 'alevel' : ''}">${g.badge === 'as' ? 'AS' : g.badge === 'alevel' ? 'A-Level' : 'AS + A-Level'}</span>
      ${g.name}
    </div>
    ${g.topics.map(t => renderTopic(t)).join('')}
  `).join('');
}

function renderTopic(t) {
  const ts = getTopicState(t.id);
  const hlClass = ts.highlight !== 'none' ? `hl-${ts.highlight}` : '';
  const checkedClass = ts.checked ? 'checked' : '';
  return `
    <div class="topic-row ${hlClass}" id="row-${t.id}">
      <input type="checkbox" class="topic-check" ${ts.checked ? 'checked' : ''}
        onchange="toggleCheck('${t.id}', this.checked)">
      <span class="topic-code">${t.id}</span>
      <span class="topic-name ${checkedClass}">${t.name}</span>
      <span class="topic-tag ${t.level}">${t.level === 'as' ? '★ AS' : '■ A2'}</span>
      <button class="hl-btn ${ts.highlight === 'easy' ? 'easy' : ''}" onclick="setHighlight('${t.id}', 'easy')" title="Mark as Easy">🟢</button>
      <button class="hl-btn ${ts.highlight === 'review' ? 'review' : ''}" onclick="setHighlight('${t.id}', 'review')" title="Mark as Needs Review">🟡</button>
      <button class="hl-btn ${ts.highlight === 'hard' ? 'hard' : ''}" onclick="setHighlight('${t.id}', 'hard')" title="Mark as Hard">🔴</button>
    </div>
  `;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function toggleCheck(id, checked) {
  getTopicState(id).checked = checked;
  saveState();
  const row = document.getElementById('row-' + id);
  if (row) {
    const nameEl = row.querySelector('.topic-name');
    if (nameEl) nameEl.classList.toggle('checked', checked);
  }
  updateStats();
}

function setHighlight(id, type) {
  const ts = getTopicState(id);
  ts.highlight = ts.highlight === type ? 'none' : type;
  saveState();
  const row = document.getElementById('row-' + id);
  if (row) {
    row.className = 'topic-row' + (ts.highlight !== 'none' ? ` hl-${ts.highlight}` : '');
    row.querySelectorAll('.hl-btn').forEach(btn => btn.className = 'hl-btn');
    if (ts.highlight !== 'none') {
      const icons = ['easy','review','hard'];
      const btns = row.querySelectorAll('.hl-btn');
      const idx = icons.indexOf(ts.highlight);
      if (btns[idx]) btns[idx].className = `hl-btn ${ts.highlight}`;
    }
  }
  updateStats();
}

function updateStats() {
  let totalTopics = 0, checkedTopics = 0, easyCount = 0, hardCount = 0, reviewCount = 0;
  SECTIONS.forEach(s => s.groups.forEach(g => g.topics.forEach(t => {
    const ts = getTopicState(t.id);
    totalTopics++;
    if (ts.checked) checkedTopics++;
    if (ts.highlight === 'easy') easyCount++;
    if (ts.highlight === 'hard') hardCount++;
    if (ts.highlight === 'review') reviewCount++;
  })));
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-pill blue"><span>${checkedTopics}</span>/${totalTopics} Done</div>
    <div class="stat-pill green"><span>${easyCount}</span> Easy</div>
    <div class="stat-pill red"><span>${hardCount}</span> Hard</div>
    <div class="stat-pill yellow"><span>${reviewCount}</span> Review</div>
  `;
  const pct = totalTopics ? Math.round(checkedTopics / totalTopics * 100) : 0;
  document.getElementById('pfFill').style.width = pct + '%';
  document.getElementById('pfPct').textContent = pct + '%';
}

function toggleSection(code, headerEl) {
  if (openSections.has(code)) {
    openSections.delete(code);
    headerEl.classList.remove('open');
    headerEl.querySelector('.chevron').classList.remove('open');
    const body = document.getElementById('body-' + code);
    if (body) body.remove();
  } else {
    openSections.add(code);
    headerEl.classList.add('open');
    headerEl.querySelector('.chevron').classList.add('open');
    const sectionData = SECTIONS.find(s => s.code === code);
    const body = document.createElement('div');
    body.className = 'section-body';
    body.id = 'body-' + code;
    body.innerHTML = renderGroups(sectionData.groups);
    headerEl.parentElement.appendChild(body);
  }
}

function setFilter(f, btn) {
  activeFilter = f;
  activeHlFilter = null;
  document.querySelectorAll('#filterGroup .filter-btn').forEach(b => b.className = 'filter-btn');
  if (btn) btn.className = 'filter-btn active';
  render();
}

function setHighlightFilter(type, btn) {
  if (activeHlFilter === type) {
    activeHlFilter = null;
    if (btn) btn.className = 'filter-btn';
  } else {
    activeHlFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => {
      if (['easy','hard','review'].some(x => b.dataset.filter === x)) b.className = 'filter-btn';
    });
    if (btn) btn.className = `filter-btn active-${type}`;
  }
  render();
}

function applyFilters() { render(); }

function expandAll() {
  SECTIONS.forEach(s => openSections.add(s.code));
  render();
}

function resetAll() {
  if (!confirm('Reset all checkboxes and highlights? This cannot be undone.')) return;
  state = {};
  saveState();
  render();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadState();
render();
